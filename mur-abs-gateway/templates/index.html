<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mur Abs Gateway</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Mur Abs Gateway</h1>
      <p class="subtitle">Abstract trigger configuration &amp; live event log</p>
      <div class="info-strip">
        <span class="info-item">
          <span class="info-label">Trigger Server</span>
          <span class="info-value" id="info-trigger">—</span>
          <span class="info-dot" id="info-trigger-dot" title="connection state"></span>
        </span>
        <span class="info-item">
          <span class="info-label">Scene Service</span>
          <span class="info-value" id="info-scene-url">—</span>
        </span>
        <span class="info-item">
          <span class="info-label">Active Scene</span>
          <span class="info-value" id="info-active-scene">—</span>
        </span>
        <span class="info-item">
          <span class="info-label">Devices</span>
          <span class="info-value" id="info-device-count">—</span>
        </span>
      </div>
    </header>

    <section class="controls">
      <div class="row">
        <button id="btn-add-trigger" class="btn primary">+ Add abstract trigger</button>
        <button id="btn-reload" class="btn">Reload from disk</button>
      </div>
    </section>

    <main>
      <div id="trigger-cards" class="card-grid">
        <p class="empty-hint" id="empty-hint">Loading configuration…</p>
      </div>
    </main>

    <section class="log-panel">
      <h2>Recent events</h2>
      <div id="event-log" class="event-log"></div>
    </section>
  </div>

  <template id="card-template">
    <div class="trigger-card">
      <div class="trigger-header">
        <input class="trigger-name" type="text" placeholder="AbstractTriggerName" />
      </div>
      <div class="trigger-meta">
        <label>
          <span>Associated device</span>
          <select class="associated-device"></select>
        </label>
      </div>
      <div class="mappings"></div>
      <button class="btn add-mapping">+ Add mapping</button>
      <div class="card-footer">
        <span class="card-feedback"></span>
        <button class="btn save-card" disabled>Save</button>
        <button class="btn destructive delete-card">Delete</button>
      </div>
    </div>
  </template>

  <template id="mapping-template">
    <div class="mapping-row">
      <select class="upstream-select"></select>
      <select class="file-select"></select>
      <button class="btn-icon delete-mapping" title="Remove mapping">&times;</button>
    </div>
  </template>

  <script src="/static/js/app.js"></script>
</body>
</html>
